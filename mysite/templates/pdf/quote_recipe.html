{% load render_table from django_tables2 %}
{% load static %}
<!doctype html>
<meta charset="utf-8">
<html>
    <style type="text/css">
            @page {
                size: letter landscape;
                margin: 1.27cm; 
            }
            body {
                font-weight: 200;
                font-size: 14px; 
            }
            .header {
                font-size: 20px;
                font-weight: 100;
                text-align: center;
                color: white;
            }
            .logo {
                display: auto;
                margin: auto;
            }
            .title {
                font-size: 22px;
                font-weight: 120;
                text-align: left;
            }
            .title-table {
                border-style: solid;
                border-color: black;
                background-color: black;
                padding-top: 2px;
                font-size: 12px;
            }
            .table-container {
                border-style: solid;
                border-color: black;
                padding: 2px;
                border-collapse: collapse;
            }

            .table-container th {
                background-color: #000;
                color: #fff;
                text-align: center;
                text-decoration: none;
                vertical-align: bottom;
            }
            .recipe_table {
                table-layout: auto;
                font-size: 12px;
                text-align: center;
                vertical-align: middle;
            }

            .ingredients {
                table-layout: auto;
                border-collapse: collapse;
                font-size: 11px;
                text-align: center;
                vertical-align: middle;
            }

            .ingredients  {
                color: black;
                background-color: #fff;
                font-size: 12px;
            }

            .ingredients td.supplier {
                width: 35%;
            }
            .ingredients td.ingredient {
                width: 40%;
            }

            .iuc_num.odd td {
                background-color: pink;
            }
            .details {
                padding: 10px 20px 0px 20px;
                text-align: left !important;
            }
        </style>
    <head>
        <div class='header'>
            <table class="title-table" height="50">
                <td width="150" height="50"><img class="logo" src='/home/dan/Projects/research/mysite/static-files/admin_tools/images/django.png' alt="Logo">
                </td>
                <td class="title" height="50">Quote Recipe</td>
            </table>
        </div>
    </head>
    
    <b1>
    {% render_table recipe_table %}
    </b1>
    <b2>
    {% render_table ingredient_table %}
    </b2>
</html>
